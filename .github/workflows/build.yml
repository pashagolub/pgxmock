name: Build & Test
on: 
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
      
jobs:

  build-and-test:
    if: true # false to skip job during debug
    name: Test and Build on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the two most recent Go releases, see the version support policy
        go: ['1.25', '1.26']
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Get dependencies
      run: |
        go mod download
        go version

    - name: GolangCI-Lint
      if: matrix.go == '1.26'
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest      

    - name: Test
      # -race guards the concurrency the mock documents; ./... keeps the
      # examples compiling and running; -coverpkg keeps the profile scoped to
      # the library while still crediting the coverage the examples provide.
      run: go test -race -v ./... -coverprofile=profile.cov -coverpkg=github.com/pashagolub/pgxmock/v6

    - name: Coveralls
      if: matrix.go == '1.26'
      uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: profile.cov      
